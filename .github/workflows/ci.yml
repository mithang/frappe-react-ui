name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: typecheck + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci only — see docs/agent-rules for why package.json/package-lock.json are W0-owned.
      - run: npm ci
      - run: npm run typecheck
      # Informational — the repo has a known, tracked baseline of pre-existing lint errors (see
      # docs/BASELINE.md); this step reports them but doesn't gate the build on fixing them all.
      # lint:any-ratchet below is the actual gate: it fails only on a REGRESSION past baseline.
      - run: npm run lint
        continue-on-error: true
      - run: npm run lint:any-ratchet
      - run: npm test

  e2e:
    name: e2e (login -> read -> write, same-site cross-origin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # *.localtest.me already resolves to 127.0.0.1 publicly — no /etc/hosts edits needed for
      # app.localtest.me / erp.localtest.me. This keeps the runner's DNS behavior identical to a
      # local run, which is the point: same-site cross-origin, not the dev proxy.
      # ubuntu-latest runners are x86_64, which avoids an arm64/podman-specific redis-server
      # boot failure seen locally on Apple Silicon (see docs/agent-rules/run-against-bench.md) —
      # if this step ever flakes on that, don't assume it reproduces the same way locally.
      - name: Boot the Frappe bench
        run: |
          docker run -d --name frappe-sne -p 8000:8000 docker.io/vyogo/erpnext:sne-version-16
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "Bench did not become ready in time" >&2
            docker logs frappe-sne >&2
            exit 1
          fi

      - name: Configure bench CORS / allowed_referrers for the SPA origin
        run: |
          docker exec frappe-sne bash -c "
            cd \$(find / -maxdepth 3 -iname 'frappe-bench' 2>/dev/null | head -1) &&
            python3 -c \"
          import json
          path = 'sites/dev.localhost/site_config.json'
          with open(path) as f:
              cfg = json.load(f)
          cfg['allow_cors'] = ['http://app.localtest.me:5173']
          cfg['allowed_referrers'] = ['http://app.localtest.me:5173']
          with open(path, 'w') as f:
              json.dump(cfg, f, indent=1)
          \" &&
            bench --site dev.localhost clear-cache
          "

      - run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - if: always()
        run: docker logs frappe-sne || true
